<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Video</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
  // YouTube-embed wrapper. The native app's internal origin (capacitor://)
  // is rejected by YouTube (error 153) — but THIS page is fetched from
  // pulse.geddo.online, so the player sees a real https origin and works.
  // Params: v (video id, required), autoplay, mute, loop, controls.
  var q = new URLSearchParams(location.search);
  var v = (q.get('v') || '').replace(/[^\w-]/g, '');
  if (v) {
    var p = new URLSearchParams({ playsinline: '1', rel: '0', modestbranding: '1' });
    ['autoplay', 'mute', 'controls'].forEach(function (k) {
      var val = q.get(k);
      if (val !== null) p.set(k, val === '1' ? '1' : '0');
    });
    if (q.get('loop') === '1') { p.set('loop', '1'); p.set('playlist', v); }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + v + '?' + p.toString();
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    document.body.appendChild(f);
  }
</script>
</body>
</html>
