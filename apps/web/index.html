<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen icon: Safari ignores the web manifest icons, so these are
         required or the installed app shows a blank/screenshot tile. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PULSE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Pinch-zoom stays enabled (WCAG 1.4.4) — locking scale never worked on iOS anyway. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PULSE 🇪🇬 كوتشك المصري في بيتك — تمرّن، اتحدى أصحابك، وكل صح. ببلاش</title>
    <meta name="description" content="تمارين بالفيديو، حساب سعرات بالأكل المصري (بالصوت!)، تحديات ودوري أسبوعي مع أصحابك — كله مجاني ١٠٠٪ من غير اشتراك. Workouts, Egyptian food calorie tracking and challenges — 100% free." />
    <!-- Social share cards (WhatsApp/Facebook scrapers don't run JS — these statics are what they see) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PULSE" />
    <meta property="og:title" content="جسمك هيشكرك 💪 كوتشك المصري في بيتك — مجاني ١٠٠٪ | PULSE" />
    <meta property="og:description" content="تمارين بالفيديو لكل مستوى، سجّل أكلك بالصوت وبيحسبلك السعرات بالأكل المصري، تحديات ودوري مع أصحابك. من غير فيزا ولا اشتراك — افتح اللينك وجرب بنفسك." />
    <meta property="og:url" content="https://pulse.geddo.online/" />
    <meta property="og:image" content="https://pulse.geddo.online/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nunito = Latin text · Fraunces = display numerals · Tajawal = Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
